[tools]
go = "1.26"
node = "24"
# npm backend rather than the default aqua one: aqua verifies pnpm's GitHub
# artifact attestations, which currently fail against pnpm's release workflow.
#
# Pinned, and kept equal to package.json's packageManager field. With "latest"
# the two disagree, and pnpm quietly downloads the pinned version at every
# invocation to honour packageManager -- reproducible, but an undeclared
# network fetch in the middle of CI.
"npm:pnpm" = "10.15.0"
golangci-lint = "latest"
"go:github.com/bokwoon95/wgo" = "latest"

[env]
# mattn/go-sqlite3 omits FTS5 unless this tag is set, and without it the schema
# fails at runtime with the unhelpful "no such module: fts5". Setting it in the
# environment rather than in a build wrapper means plain `go test`, `go vet`,
# and editor tooling all get it too.
GOFLAGS = "-tags=sqlite_fts5"

# Where the embedding model and the sqlite-lembed extension are installed.
SPIREWEB_DATA_DIR = "{{env.HOME}}/.local/share/spireweb"

# Compile sqlite-vec against the header for the SQLite that actually gets
# linked, rather than whatever the machine has in /usr/include. See
# mise-tasks/sqlite-header. Pointing at a directory that does not exist yet is
# harmless; the build task stages it first.
CGO_CFLAGS = "-I{{config_root}}/third_party/sqlite"

[tasks.sqlite-header]
description = "Stage sqlite3.h matching go-sqlite3's bundled amalgamation"
sources = ["go.sum"]
outputs = ["third_party/sqlite/sqlite3.h"]

[tasks.ts]
description = "Compile TypeScript to web/static/app.js"
run = "pnpm exec tsc"
sources = ["internal/web/ts/*.ts", "tsconfig.json"]
outputs = ["internal/web/static/app.js"]

[tasks.build]
description = "Build the spireweb binary"
depends = ["ts", "sqlite-header"]
# git describe fails in a repository with no tags, and an empty -X value sets
# Version to the empty string rather than leaving the source default.
run = 'go build -ldflags "-X main.Version=$(git describe --tags --dirty 2>/dev/null || echo dev)" -o spireweb ./cmd/spireweb'

[tasks.test]
description = "Run the Go test suite"
# The web package embeds internal/web/static, and app.js is generated rather
# than committed. Without this a fresh clone fails the test asserting the
# app's own script is served -- as CI did, before this line.
depends = ["ts", "sqlite-header"]
run = "go test ./..."

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -l -w ."

[tasks.lint]
description = "Vet, lint, and typecheck"
depends = ["sqlite-header"]
run = [
  "go vet ./...",
  "golangci-lint run",
  "pnpm exec oxlint internal/web/ts e2e",
  "pnpm exec tsc --noEmit",
  # The e2e sources are not part of the browser build and have their own
  # config: node and @playwright/test in scope, nothing emitted.
  "pnpm exec tsc -p e2e",
]

[tasks.gofmt-check]
description = "Fail if any Go source is unformatted"
run = 'out=$(gofmt -l .); if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi'

[tasks.check]
description = "Everything CI runs; run this before committing"
depends = ["gofmt-check", "lint", "test"]

[tasks.index]
description = "Build the search index"
depends = ["build"]
run = "./spireweb index"

[tasks."dev:go"]
description = "Run the server, rebuilding on change"
run = "wgo run ./cmd/spireweb serve --dev --titles-via=claude"

[tasks."dev:ts"]
description = "Compile TypeScript on change"
run = "pnpm exec tsc --watch --preserveWatchOutput"

[tasks.dev]
description = "Run the server and the TypeScript compiler in watch mode"
depends = ["dev:go", "dev:ts"]

[tasks.e2e]
description = "Browser smoke tests (run e2e-install once first)"
# Playwright starts the server itself (see e2e/serve.sh), which is what knows
# how to build a throwaway index over the committed fixtures.
#
# Deliberately not part of `check`: it is an order of magnitude slower than
# everything else and needs a browser that is not a repository dependency.
run = "pnpm exec playwright test"

[tasks.e2e-install]
description = "Download the browser the e2e tests drive"
# Playwright's browsers live in a shared cache outside the repo, and the
# version is tied to the @playwright/test release. Bumping that package means
# running this again; Playwright says so itself when the build is missing.
run = "pnpm exec playwright install chromium"

[tasks.clean]
run = "rm -f spireweb internal/web/static/app.js internal/web/static/app.js.map && rm -rf test-results playwright-report"
