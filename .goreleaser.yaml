# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# darwin/arm64 only, deliberately. go-sqlite3, the sqlite-vec bindings and
# FTS5 all need cgo, so CGO_ENABLED=0 -- which is how the other repositories
# here cross-compile four ways from one runner -- is not available. Restricting
# the target to the one architecture everybody involved runs removes the cross
# compilation problem rather than solving it: a macos runner is already arm64,
# so nothing is cross-compiled at all.
#
# Must run under mise, which is where CGO_CFLAGS comes from. See the preflight
# hook below, and `mise run release`.
version: 2

before:
  hooks:
    # sqlite-vec's cgo bindings compile with #include "sqlite3.h", and the
    # header they get has to be the one matching the amalgamation go-sqlite3
    # actually links rather than whatever the machine has. CGO_CFLAGS points at
    # third_party/sqlite; mise.toml sets it, and a release built without it
    # compiles perfectly well against the wrong struct layouts. Fail loudly
    # instead.
    - >-
      sh -c 'case "$CGO_CFLAGS" in *third_party/sqlite*) ;;
      *) echo "CGO_CFLAGS does not point at third_party/sqlite -- run it through mise, with (mise run release)" >&2; exit 1 ;; esac'

    # Both generated, neither committed, both required.
    - mise run sqlite-header
    # internal/web embeds internal/web/static, and app.js is compiled from
    # TypeScript. A missing one is embedded silently and ships the previous
    # release's keyboard handling, so this cannot be left to whoever invokes
    # goreleaser.
    - mise run ts

    # Builds the sqlite-lembed dylib and downloads the model, then copies both
    # into build/ for the archive below. Idempotent; the slow part only runs
    # when they are missing.
    - mise run release-assets

builds:
  - id: spireweb
    main: ./cmd/spireweb
    binary: spireweb
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
    # Explicit rather than inherited from mise.toml's GOFLAGS. Without the tag
    # the binary builds and then fails at runtime with "no such module: fts5",
    # which is not a thing to learn from a bug report.
    flags:
      - -tags=sqlite_fts5
    ldflags:
      # main.Version, not the main.version goreleaser defaults to: the variable
      # already exists and `mise run build` already stamps it the same way.
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: ["tar.gz"]
    # One target, so there is nothing to template: the name says what it is.
    name_template: "{{ .ProjectName }}_{{ .Version }}_macos_arm64"
    files:
      - README.md
      - NOTICE.md
      # Flat, beside the binary, because that is where embed.DefaultPaths looks:
      # it resolves the executable and checks its own directory first. A
      # Homebrew cask symlinks only spireweb onto PATH and leaves everything
      # else in the Caskroom, so resolving through the symlink is what finds
      # these.
      - src: build/lembed0.dylib
        dst: .
        strip_parent: true
      - src: build/all-MiniLM-L6-v2.Q8_0.gguf
        dst: .
        strip_parent: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# A cask, not a formula. git-ls uses goreleaser's `brews:` block because that
# was the preferred path when it was written; Homebrew has since moved prebuilt
# binaries to casks, and llimllib/homebrew-tap already holds only Casks/.
homebrew_casks:
  - name: spireweb
    homepage: "https://github.com/llimllib/spireweb"
    description: "Search and read pi agent sessions"
    # Only the binary goes onto PATH. The extension and the model stay in the
    # Caskroom beside it, which embed.DefaultPaths finds by resolving the
    # symlink -- see internal/embed/paths_test.go.
    binaries:
      - spireweb
    repository:
      owner: llimllib
      name: homebrew-tap
      branch: main
      # GITHUB_TOKEN cannot push to another repository, so this needs a PAT
      # secret on the spireweb repo.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Homebrew clears quarantine on its own downloads, so there is no
    # notarization step and no gatekeeper prompt to talk anyone through.
    caveats: |
      spireweb indexes your agent sessions on first run.

      The first semantic search compiles Metal shaders and takes about
      15 seconds; subsequent runs are instant until macOS evicts its
      shader cache.

release:
  footer: |
    ---

    The archive carries the sqlite-lembed extension and the embedding model
    beside the binary, so semantic search works from an unpacked tarball with
    nothing else installed.

    `brew install llimllib/tap/spireweb`
